name: Build OrnetTranslate

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid dpkg make

      - name: Setup roothide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: |
          export THEOS="$HOME/theos"
          gmake clean || true
          gmake package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: OrnetTranslate-deb
          path: packages/*.deb
